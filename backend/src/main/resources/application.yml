spring:
  application:
    name: live-backend
  config:
    # 루트 .env(KEY=VALUE)를 프로퍼티로 읽는다. backend/ 에서 실행해도, 루트에서 실행해도 동작.
    import:
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:live}
    username: ${DB_USERNAME:live}
    password: ${DB_PASSWORD:live}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: 30m
    refresh-token-ttl: 14d
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    enabled: ${DEMO_ENABLED:true}
    password: ${DEMO_PASSWORD:demo1234!}

livekit:
  url: ${LIVEKIT_URL:}
  api-key: ${LIVEKIT_API_KEY:}
  api-secret: ${LIVEKIT_API_SECRET:}
  token-ttl: 6h
  # 방을 미리 만들 때 아무도 안 들어오거나 모두 나간 뒤 자동 종료까지 시간(초)
  empty-timeout-seconds: 120

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health
